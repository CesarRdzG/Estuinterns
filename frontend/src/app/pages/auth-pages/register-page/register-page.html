<form class="modern-form">
    <h2>Nuevo Usuario</h2>

    <div class="form-control-group">
        <label for="name">Nombre completo</label>
        <input id="name" type="text" formControlName="name" placeholder="Ej. Leanne Graham">
        <span class="error-text">El nombre es obligatorio.</span>
        <span class="error-text">Debe tener al menos 3 caracteres.</span>

    </div>

    <div class="form-control-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="legra@gmail.com">
        <span class="error-text">El correo es obligatorio.</span>
        <span class="error-text">Ingresa un formato de correo válido.</span>

    </div>

    <div class="form-control-group">
        <label for="username">Nombre de usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="Ej. LeGra">
        <span class="error-text">El usuario es obligatorio.</span>

    </div>

    <div class="form-control-group">
        <label for="image">URL de la Imagen</label>
        <input id="image" type="text" formControlName="image" placeholder="Ej. https://i.pravatar.cc/150?img=1">
        <span class="error-text">La URL de la imagen es obligatoria.</span>

    </div>

    <button type="submit">Guardar Usuario</button>
</form>
